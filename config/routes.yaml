# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Ceci est l'entrée pour l'autodiscovery des contrôleurs
# Elle dit à Symfony : "Va dans le dossier 'src/Controller' et lis toutes les annotations/attributes #[Route]"
controllers:
    resource: '../src/Controller/'
    type: attribute # Assurez-vous d'utiliser 'attribute' si vous êtes sur Symfony 6+
    